<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<title>Bot Dashboard</title>
<style>
  :root{
    --bg:#0b0d10;
    --bg-elev:#13161b;
    --bg-elev-2:#1a1e25;
    --border:#22262e;
    --text:#e8eaed;
    --text-dim:#8b919c;
    --accent:#5b8cff;
    --ok:#3ddc97;
    --warn:#f5b942;
    --err:#ff5d5d;
    --cmd:#c792ea;
    --info:#5b8cff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    font-size:14px;
    overscroll-behavior-y:contain;
  }

  header{
    position:sticky; top:0; z-index:20;
    padding:calc(12px + var(--safe-top)) 14px 10px;
    background:rgba(11,13,16,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);transition:.2s;}
  .brand .dot.connected{background:var(--ok); box-shadow:0 0 8px var(--ok);}
  .brand .dot.disconnected{background:var(--err); box-shadow:0 0 8px var(--err);}
  .brand h1{font-size:15px; font-weight:600; margin:0;}
  .brand .sub{font-size:11px; color:var(--text-dim);}
  .icon-btn{
    background:var(--bg-elev); border:1px solid var(--border); color:var(--text);
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .icon-btn:active{background:var(--bg-elev-2);}

  .stats-wrap{padding:12px 14px 4px;}
  .stats-scroll{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none;
  }
  .stats-scroll::-webkit-scrollbar{display:none;}
  .stat-card{
    flex:0 0 auto; min-width:96px;
    background:var(--bg-elev); border:1px solid var(--border); border-radius:14px;
    padding:10px 12px;
  }
  .stat-card .label{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .stat-card .value{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat-card .value.ok{color:var(--ok);}
  .stat-card .value.warn{color:var(--warn);}

  .toolbar{
    padding:10px 14px; display:flex; gap:8px; align-items:center;
    position:sticky; top:calc(54px + var(--safe-top)); z-index:15;
    background:var(--bg);
  }
  .search{
    flex:1; display:flex; align-items:center; gap:6px;
    background:var(--bg-elev); border:1px solid var(--border); border-radius:12px;
    padding:8px 12px;
  }
  .search input{
    flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px;
  }
  .search input::placeholder{color:var(--text-dim);}

  .filters{
    display:flex; gap:6px; overflow-x:auto; padding:0 14px 10px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600;
    background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim);
  }
  .chip.active{color:var(--bg); border-color:transparent;}
  .chip[data-level="ALL"].active{background:var(--text);}
  .chip[data-level="INFO"].active{background:var(--info);}
  .chip[data-level="OK"].active{background:var(--ok);}
  .chip[data-level="WARN"].active{background:var(--warn);}
  .chip[data-level="ERROR"].active{background:var(--err);}
  .chip[data-level="CMD"].active{background:var(--cmd);}

  #logList{
    padding:4px 10px calc(90px + var(--safe-bottom));
  }
  .log-entry{
    display:flex; gap:8px;
    padding:9px 10px; margin-bottom:6px;
    background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--text-dim);
    border-radius:10px;
    animation:slideIn .15s ease-out;
  }
  @keyframes slideIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
  .log-entry.INFO{border-left-color:var(--info);}
  .log-entry.OK{border-left-color:var(--ok);}
  .log-entry.WARN{border-left-color:var(--warn);}
  .log-entry.ERROR{border-left-color:var(--err); background:rgba(255,93,93,0.06);}
  .log-entry.CMD{border-left-color:var(--cmd);}
  .log-main{flex:1; min-width:0;}
  .log-top{display:flex; align-items:center; gap:6px; margin-bottom:2px;}
  .log-level{font-size:10px; font-weight:700; letter-spacing:.03em;}
  .log-level.INFO{color:var(--info);}
  .log-level.OK{color:var(--ok);}
  .log-level.WARN{color:var(--warn);}
  .log-level.ERROR{color:var(--err);}
  .log-level.CMD{color:var(--cmd);}
  .log-src{font-size:10px; color:var(--text-dim); background:var(--bg-elev-2); padding:1px 6px; border-radius:6px;}
  .log-time{font-size:10px; color:var(--text-dim); margin-left:auto; font-variant-numeric:tabular-nums;}
  .log-msg{font-size:13px; line-height:1.4; word-break:break-word; white-space:pre-wrap;}
  .empty-state{
    text-align:center; color:var(--text-dim); padding:60px 20px; font-size:13px;
  }

  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    padding:10px 14px calc(10px + var(--safe-bottom));
    background:rgba(11,13,16,0.9); backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex; gap:8px; align-items:center;
  }
  .toggle-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:11px; border-radius:12px; font-size:13px; font-weight:600;
    background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim);
  }
  .toggle-btn.active{color:var(--accent); border-color:var(--accent);}
  .clear-btn{
    padding:11px 16px; border-radius:12px; font-size:13px; font-weight:600;
    background:rgba(255,93,93,0.1); border:1px solid var(--err); color:var(--err);
  }
  .clear-btn:active, .toggle-btn:active{opacity:.7;}

  .jump-fab{
    position:fixed; right:16px; bottom:calc(72px + var(--safe-bottom));
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:8px 14px; font-size:12px; font-weight:600;
    box-shadow:0 4px 14px rgba(91,140,255,0.4);
    display:none; align-items:center; gap:4px; z-index:19;
  }
  .jump-fab.show{display:flex;}

  /* ── Auth gate ── */
  .auth-gate{
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:24px; padding-top:calc(24px + var(--safe-top));
  }
  .auth-card{
    width:100%; max-width:340px;
    background:var(--bg-elev); border:1px solid var(--border); border-radius:18px;
    padding:24px 20px; text-align:center;
  }
  .auth-card h2{margin:0 0 6px; font-size:18px;}
  .auth-card p{margin:0 0 16px; font-size:13px; color:var(--text-dim);}
  .auth-card input{
    width:100%; padding:12px 14px; border-radius:12px; margin-bottom:10px;
    background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text);
    font-size:15px; outline:none; text-align:center;
  }
  .auth-card input:focus{border-color:var(--accent);}
  .auth-card button{
    width:100%; padding:12px; border-radius:12px; border:none;
    background:var(--accent); color:#fff; font-size:14px; font-weight:700;
  }
  .auth-card button:active{opacity:.8;}
  .auth-error{
    margin-top:10px; font-size:12px; color:var(--err); min-height:14px;
  }
</style>
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <h2>🔒 Akses Dashboard</h2>
    <p>Masukkan token untuk membuka dashboard bot.</p>
    <input type="password" id="tokenInput" placeholder="Token" autocomplete="off" />
    <button id="tokenSubmit">Masuk</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<div id="app" style="display:none;">
<header>
  <div class="brand">
    <span class="dot" id="connDot"></span>
    <div>
      <h1>Bot Dashboard</h1>
      <div class="sub" id="connSub">Menghubungkan...</div>
    </div>
  </div>
  <button class="icon-btn" id="refreshBtn" title="Reload">⟳</button>
</header>

<div class="stats-wrap">
  <div class="stats-scroll">
    <div class="stat-card"><div class="label">Status</div><div class="value" id="statStatus">—</div></div>
    <div class="stat-card"><div class="label">Uptime</div><div class="value" id="statUptime">—</div></div>
    <div class="stat-card"><div class="label">Guilds</div><div class="value" id="statGuilds">—</div></div>
    <div class="stat-card"><div class="label">Members</div><div class="value" id="statMembers">—</div></div>
    <div class="stat-card"><div class="label">Ping</div><div class="value" id="statPing">—</div></div>
    <div class="stat-card"><div class="label">Memory</div><div class="value" id="statMem">—</div></div>
  </div>
</div>

<div class="toolbar">
  <div class="search">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Cari log…" />
  </div>
</div>

<div class="filters" id="filterChips">
  <div class="chip active" data-level="ALL">Semua</div>
  <div class="chip" data-level="INFO">Info</div>
  <div class="chip" data-level="OK">OK</div>
  <div class="chip" data-level="WARN">Warn</div>
  <div class="chip" data-level="ERROR">Error</div>
  <div class="chip" data-level="CMD">Cmd</div>
</div>

<div id="logList"></div>

<button class="jump-fab" id="jumpFab">⬇ Log baru</button>

<div class="bottombar">
  <button class="toggle-btn active" id="autoScrollBtn">⬇ Auto-scroll</button>
  <button class="clear-btn" id="clearBtn">Clear</button>
</div>
</div>

<script>
(function(){
  const logList = document.getElementById('logList');
  const connDot = document.getElementById('connDot');
  const connSub = document.getElementById('connSub');
  const searchInput = document.getElementById('searchInput');
  const filterChips = document.getElementById('filterChips');
  const autoScrollBtn = document.getElementById('autoScrollBtn');
  const clearBtn = document.getElementById('clearBtn');
  const jumpFab = document.getElementById('jumpFab');
  const refreshBtn = document.getElementById('refreshBtn');
  const authGate = document.getElementById('authGate');
  const appRoot = document.getElementById('app');
  const tokenInput = document.getElementById('tokenInput');
  const tokenSubmit = document.getElementById('tokenSubmit');
  const authError = document.getElementById('authError');

  const TOKEN_KEY = 'dashboard_token';
  let logs = [];
  let activeLevel = 'ALL';
  let searchTerm = '';
  let autoScroll = true;
  let ws = null;
  let rejectedOnce = false;

  function fmtTime(iso){
    const d = new Date(iso);
    return d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  function fmtUptime(sec){
    sec = Math.floor(sec);
    const d = Math.floor(sec/86400); sec%=86400;
    const h = Math.floor(sec/3600); sec%=3600;
    const m = Math.floor(sec/60);
    if(d>0) return `${d}d ${h}h`;
    if(h>0) return `${h}h ${m}m`;
    return `${m}m`;
  }
  function fmtBytes(b){
    if(b > 1024*1024*1024) return (b/1024/1024/1024).toFixed(1)+'GB';
    return (b/1024/1024).toFixed(0)+'MB';
  }
  function isNearBottom(){
    return (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 150);
  }

  function matchesFilter(entry){
    if(activeLevel !== 'ALL' && entry.level !== activeLevel) return false;
    if(searchTerm){
      const hay = (entry.msg + ' ' + entry.src).toLowerCase();
      if(!hay.includes(searchTerm)) return false;
    }
    return true;
  }

  function renderAll(){
    const filtered = logs.filter(matchesFilter);
    if(filtered.length === 0){
      logList.innerHTML = '<div class="empty-state">Belum ada log yang cocok.</div>';
      return;
    }
    logList.innerHTML = filtered.map(entryHtml).join('');
    if(autoScroll) scrollToBottom();
  }

  function entryHtml(entry){
    const level = entry.level || 'INFO';
    return `<div class="log-entry ${level}">
      <div class="log-main">
        <div class="log-top">
          <span class="log-level ${level}">${level}</span>
          <span class="log-src">${escapeHtml(entry.src||'-')}</span>
          <span class="log-time">${fmtTime(entry.time)}</span>
        </div>
        <div class="log-msg">${escapeHtml(entry.msg)}</div>
      </div>
    </div>`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function appendEntry(entry){
    logs.push(entry);
    if(logs.length > 500) logs.shift();
    if(!matchesFilter(entry)) return;

    const wasNearBottom = isNearBottom();
    const empty = logList.querySelector('.empty-state');
    if(empty) empty.remove();

    logList.insertAdjacentHTML('beforeend', entryHtml(entry));

    if(autoScroll && wasNearBottom){
      scrollToBottom();
    } else if(!autoScroll || !wasNearBottom){
      jumpFab.classList.add('show');
    }
  }

  function scrollToBottom(){
    window.scrollTo({top: document.body.scrollHeight, behavior:'auto'});
    jumpFab.classList.remove('show');
  }

  function updateStats(s){
    document.getElementById('statStatus').textContent = s.status === 'online' ? 'Online' : 'Connecting';
    document.getElementById('statStatus').className = 'value ' + (s.status === 'online' ? 'ok' : 'warn');
    if(typeof s.uptime === 'number') document.getElementById('statUptime').textContent = fmtUptime(s.uptime);
    if(typeof s.guildCount === 'number') document.getElementById('statGuilds').textContent = s.guildCount;
    if(typeof s.memberCount === 'number') document.getElementById('statMembers').textContent = s.memberCount.toLocaleString('id-ID');
    if(typeof s.ping === 'number') document.getElementById('statPing').textContent = (s.ping < 0 ? '—' : s.ping + 'ms');
    if(typeof s.rss === 'number') document.getElementById('statMem').textContent = fmtBytes(s.rss);
  }

  function showGate(message){
    authGate.style.display = 'flex';
    appRoot.style.display = 'none';
    authError.textContent = message || '';
  }

  function showApp(){
    authGate.style.display = 'none';
    appRoot.style.display = 'block';
  }

  function getStoredToken(){
    try{ return localStorage.getItem(TOKEN_KEY) || ''; } catch(e){ return ''; }
  }
  function storeToken(t){
    try{ localStorage.setItem(TOKEN_KEY, t); } catch(e){}
  }
  function clearStoredToken(){
    try{ localStorage.removeItem(TOKEN_KEY); } catch(e){}
  }

  function connect(token){
    showApp();
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const qs = token ? `?token=${encodeURIComponent(token)}` : '';
    ws = new WebSocket(`${proto}//${location.host}/${qs}`);

    let openedOk = false;

    ws.onopen = () => {
      openedOk = true;
      rejectedOnce = false;
      connDot.className = 'dot connected';
      connSub.textContent = 'Terhubung';
    };
    ws.onclose = (ev) => {
      connDot.className = 'dot disconnected';
      // Kode 1006 langsung di percobaan pertama biasanya berarti server menolak upgrade (token salah/kosong)
      if(!openedOk && token !== null){
        clearStoredToken();
        showGate('Token salah atau dashboard butuh token. Coba lagi.');
        return;
      }
      connSub.textContent = 'Terputus — mencoba lagi…';
      setTimeout(() => connect(token), 2000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      let data;
      try{ data = JSON.parse(ev.data); } catch(e){ return; }

      if(data.type === 'history'){
        logs = data.logs || [];
        renderAll();
      } else if(data.type === 'log'){
        appendEntry(data);
      } else if(data.type === 'stats'){
        updateStats(data);
      } else if(data.type === 'clear'){
        logs = [];
        renderAll();
      }
    };
  }

  function tryEnter(){
    const t = tokenInput.value.trim();
    storeToken(t);
    authError.textContent = '';
    connect(t || null);
  }

  tokenSubmit.addEventListener('click', tryEnter);
  tokenInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') tryEnter();
  });

  // ── Startup: cek apakah server butuh token ──
  fetch('/api/auth-required').then(r => r.json()).then(({required}) => {
    if(!required){
      connect(null);
      return;
    }
    const stored = getStoredToken();
    if(stored){
      tokenInput.value = stored;
      connect(stored);
    } else {
      showGate('');
    }
  }).catch(() => {
    // Kalau endpoint gagal diakses, tetap coba connect tanpa token sebagai fallback
    connect(getStoredToken() || null);
  });

  filterChips.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if(!chip) return;
    filterChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeLevel = chip.dataset.level;
    renderAll();
  });

  let searchDebounce;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      searchTerm = e.target.value.trim().toLowerCase();
      renderAll();
    }, 150);
  });

  autoScrollBtn.addEventListener('click', () => {
    autoScroll = !autoScroll;
    autoScrollBtn.classList.toggle('active', autoScroll);
    if(autoScroll) scrollToBottom();
  });

  clearBtn.addEventListener('click', () => {
    if(!confirm('Hapus semua log dari layar ini?')) return;
    if(ws && ws.readyState === 1){
      ws.send(JSON.stringify({action:'clear'}));
    }
  });

  jumpFab.addEventListener('click', scrollToBottom);

  refreshBtn.addEventListener('click', () => location.reload());

  window.addEventListener('scroll', () => {
    if(isNearBottom()) jumpFab.classList.remove('show');
  });
})();
</script>
</body>
</html>
